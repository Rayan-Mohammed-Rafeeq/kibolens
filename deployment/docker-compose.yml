name: kibolens

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kibolens}
      POSTGRES_USER: ${POSTGRES_USER:-kibolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
        reservations:
          cpus: '0.5'
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kibolens]

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfiles/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      KIBOLENS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kibolens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kibolens}
      KIBOLENS_CORS_ORIGINS: '["http://localhost:8080"]'
      KIBOLENS_QDRANT_URL: http://qdrant:6333
      KIBOLENS_PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - type: bind
        source: /mnt/kiboto-storage/kibolens-data/documents
        target: /app/documents
        read_only: true
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional read-only libvirt access. Hosts without libvirt simply expose
      # an empty directory and the VM observer returns an honest empty state.
      - type: bind
        source: /var/run/libvirt
        target: /var/run/libvirt
        read_only: true
        bind:
          create_host_path: true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kibolens
      - backend_egress
      - rag
    # Read-only access is consumed only by the allowlisted observer code; the
    # socket is never returned to the API or browser.

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfiles/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          cpus: '0.1'
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kibolens
      - frontend_ingress

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - type: bind
        source: /mnt/kiboto-storage/kibolens-data/qdrant
        target: /qdrant/storage
        bind:
          create_host_path: false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          cpus: '0.25'
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rag

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle=false
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2g
        reservations:
          cpus: '0.1'
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kibolens]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128m
        reservations:
          cpus: '0.05'
          memory: 32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kibolens]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: [monitoring]
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256m
        reservations:
          cpus: '0.05'
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kibolens]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - type: bind
        source: ${KIBOLENS_ALERT_TOKEN_FILE:?set KIBOLENS_ALERT_TOKEN_FILE in .env}
        target: /run/secrets/kibolens-alert-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/kiboto-storage/kibolens-data/alertmanager
        target: /alertmanager
        bind:
          create_host_path: false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256m
        reservations:
          cpus: '0.05'
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kibolens]

  grafana:
    image: grafana/grafana:12.3.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - type: bind
        source: /mnt/kiboto-storage/kibolens-data/grafana
        target: /var/lib/grafana
        bind:
          create_host_path: false
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
        reservations:
          cpus: '0.1'
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [kibolens]

networks:
  kibolens:
    internal: true
  backend_egress:
    driver: bridge
  frontend_ingress:
    driver: bridge
  rag:
    internal: true
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: deployment_postgres_data
  prometheus_data:
    driver: local
