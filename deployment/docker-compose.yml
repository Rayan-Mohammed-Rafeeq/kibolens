services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kibolens}
      POSTGRES_USER: ${POSTGRES_USER:-kibolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfiles/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      KIBOLENS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kibolens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kibolens}
      KIBOLENS_CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfiles/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [backend]
    networks: [private]

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle=false
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks: [private]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: [monitoring]
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks: [private]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${KIBOLENS_ALERT_TOKEN_FILE:?set KIBOLENS_ALERT_TOKEN_FILE in .env}:/run/secrets/kibolens-alert-token:ro
      - alertmanager-data:/alertmanager
    networks: [private]

  grafana:
    image: grafana/grafana:12.3.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [private]

volumes:
  postgres-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  private:
    internal: true
