services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kibolens}
      POSTGRES_USER: ${POSTGRES_USER:-kibolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfiles/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      KIBOLENS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kibolens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kibolens}
      KIBOLENS_CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfiles/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [backend]
    networks: [private]

volumes:
  postgres-data:

networks:
  private:
    internal: true
