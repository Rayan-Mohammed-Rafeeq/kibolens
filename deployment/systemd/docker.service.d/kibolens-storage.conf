# KiboLens Docker Storage Protection
#
# This drop-in ensures Docker does not start and write to the root filesystem
# when the dedicated SSD logical volume is not mounted at /var/lib/docker.
#
# Storage Architecture:
#   /var/lib/docker/ - Mounted from docker-lv (40GB SSD logical volume)
#     ├── (Docker images, layers, volumes, buildkit, overlay2, etc.)
#     └── containerd-root/ - containerd content store (configured separately)
#
# containerd is configured to use /var/lib/docker/containerd-root via
# /etc/containerd/config.toml, keeping all container runtime data on SSD.
#
# If the mount fails, Docker startup will be blocked, preventing writes
# to the underlying root filesystem which has limited capacity.
#
# Installation (MUST be done BEFORE installing Docker/containerd packages):
#   sudo mkdir -p /etc/systemd/system/docker.service.d/
#   sudo cp this-file /etc/systemd/system/docker.service.d/kibolens-storage.conf
#   sudo systemctl daemon-reload

[Unit]
# Require the var-lib-docker.mount unit to be active
Requires=var-lib-docker.mount
After=var-lib-docker.mount containerd.service

# Bind to the mount - if mount fails or is unmounted, Docker stops
BindsTo=var-lib-docker.mount

# Additional requirement for the mount point itself
RequiresMountsFor=/var/lib/docker

[Service]
# Fail-closed verification: Check mount before Docker starts
# All checks must pass or Docker will not start

# Check 1: Verify /var/lib/docker is mounted
ExecStartPre=/bin/sh -c 'mountpoint -q /var/lib/docker || { echo "ERROR: /var/lib/docker not mounted - refusing to start Docker" >&2; exit 1; }'

# Check 2: Verify mount source is docker-lv
ExecStartPre=/bin/sh -c 'SRC=$(findmnt -n -o SOURCE /var/lib/docker); test "$SRC" = "/dev/mapper/ubuntu--vg-docker--lv" || { echo "ERROR: /var/lib/docker not on docker-lv (found: $SRC) - refusing to start" >&2; exit 1; }'

# Check 3: Verify filesystem type is ext4
ExecStartPre=/bin/sh -c 'FS=$(findmnt -n -o FSTYPE /var/lib/docker); test "$FS" = "ext4" || { echo "ERROR: /var/lib/docker filesystem is not ext4 (found: $FS) - refusing to start" >&2; exit 1; }'

# Check 4: Verify filesystem UUID is available (prevents wrong device mount)
ExecStartPre=/bin/sh -c 'UUID=$(findmnt -n -o UUID /var/lib/docker); test -n "$UUID" || { echo "ERROR: Cannot determine UUID of /var/lib/docker - refusing to start" >&2; exit 1; }'
