# KiboLens containerd Storage Protection
#
# This drop-in ensures containerd does not start and write to the root filesystem
# when the dedicated SSD logical volume is not mounted at /var/lib/docker.
#
# Storage Configuration:
#   /var/lib/docker/containerd-root/  - containerd content and metadata (SSD)
#   /run/containerd/                  - containerd runtime state (tmpfs)
#
# containerd is configured via /etc/containerd/config.toml:
#   root = "/var/lib/docker/containerd-root"
#   state = "/run/containerd"
#
# If the SSD mount fails, containerd startup will be blocked, preventing writes
# to the underlying root filesystem which has limited capacity.
#
# Installation (MUST be done BEFORE installing Docker/containerd packages):
#   sudo mkdir -p /etc/systemd/system/containerd.service.d/
#   sudo cp this-file /etc/systemd/system/containerd.service.d/kibolens-storage.conf
#   sudo systemctl daemon-reload

[Unit]
# Require the var-lib-docker.mount unit to be active
Requires=var-lib-docker.mount
After=var-lib-docker.mount

# Bind to the mount - if mount fails or is unmounted, containerd stops
BindsTo=var-lib-docker.mount

# Additional requirement for the containerd root directory
RequiresMountsFor=/var/lib/docker/containerd-root

[Service]
# Fail-closed verification: Check mount before containerd starts
# All checks must pass or containerd will not start

# Check 1: Verify /var/lib/docker is mounted
ExecStartPre=/bin/sh -c 'mountpoint -q /var/lib/docker || { echo "ERROR: /var/lib/docker not mounted - refusing to start containerd" >&2; exit 1; }'

# Check 2: Verify mount source is docker-lv (device path may vary, use findmnt)
ExecStartPre=/bin/sh -c 'SRC=$(findmnt -n -o SOURCE /var/lib/docker); test "$SRC" = "/dev/mapper/ubuntu--vg-docker--lv" || { echo "ERROR: /var/lib/docker not on docker-lv (found: $SRC) - refusing to start" >&2; exit 1; }'

# Check 3: Verify filesystem type is ext4
ExecStartPre=/bin/sh -c 'FS=$(findmnt -n -o FSTYPE /var/lib/docker); test "$FS" = "ext4" || { echo "ERROR: /var/lib/docker filesystem is not ext4 (found: $FS) - refusing to start" >&2; exit 1; }'

# Check 4: Verify filesystem UUID matches expected SSD volume
# This prevents containerd from starting if wrong device is mounted
ExecStartPre=/bin/sh -c 'UUID=$(findmnt -n -o UUID /var/lib/docker); test -n "$UUID" || { echo "ERROR: Cannot determine UUID of /var/lib/docker - refusing to start" >&2; exit 1; }'

# Check 5: Verify containerd root directory exists
ExecStartPre=/bin/sh -c 'test -d /var/lib/docker/containerd-root || { echo "ERROR: containerd root /var/lib/docker/containerd-root does not exist - refusing to start" >&2; exit 1; }'
