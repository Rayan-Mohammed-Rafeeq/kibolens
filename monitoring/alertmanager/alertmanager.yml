route:
  receiver: kibolens
  group_by: [alertname, instance, container]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: kibolens
    webhook_configs:
      - url: http://backend:8000/api/v1/monitoring/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/kibolens-alert-token
